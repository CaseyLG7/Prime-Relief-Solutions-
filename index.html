if(type==="appeal"){ content=`<div style="${style}">

<b>TEXAS EVICTION APPEAL INFORMATION</b>

• Texas provides three common methods to perfect an eviction appeal from Justice Court:

──────────────────────────────

<b>1. Appeal Bond</b>

• An Appeal Bond is a written guarantee filed with the Justice Court.

• The amount of the bond is generally determined by the judge.

• The bond usually requires one or more qualified sureties (people or companies willing to guarantee payment if required).

• The bond must generally be filed within the appeal deadline established by Texas law.

• The court clerk can explain the filing requirements and bond amount.

Common Questions

Q: Who sets the Appeal Bond amount?

A: The Justice Court judge determines the required amount.

Q: Do I pay the bond directly to the court?

A: The court will explain the filing requirements. An Appeal Bond is different from making a cash deposit.

──────────────────────────────

<b>2. Cash Deposit (Cash Bond)</b>

• Instead of filing an Appeal Bond, a tenant may qualify to make a cash deposit with the court.

• The amount is generally determined by the Justice Court.

• The funds are deposited directly with the court.

• Court staff can explain acceptable payment methods.

Common Questions

Q: Is a Cash Deposit the same as an Appeal Bond?

A: No. A Cash Deposit places money directly with the court, while an Appeal Bond is a written guarantee that satisfies the court's bond requirement.

Q: Do I get the money back?

A: The handling of deposited funds depends on the court's final orders and applicable Texas law.

──────────────────────────────

<b>3. Statement of Inability to Pay Court Costs</b>

• A person who cannot afford court costs may file a Statement of Inability to Pay Court Costs if permitted by law.

• The completed statement is filed with the Justice Court.

• The court may review the statement and determine whether it meets legal requirements.

Common Questions

Q: Does filing this statement automatically approve my appeal?

A: The court determines whether the statement satisfies legal requirements.

Q: What information is requested?

A: The form generally requests financial information regarding income, expenses, assets, and other relevant information.

──────────────────────────────

<b>Frequently Asked Questions</b>

Q: Does filing an appeal stop the eviction?

A: Texas law contains procedures regarding possession during an appeal. The court determines how the appeal proceeds.

Q: Do I still have to attend court?

A: Court appearance requirements depend on the case and court proceedings.

Q: How long does an appeal take?

A: Timeframes vary depending on the court and the circumstances of each case.

Q: Can Prime Relief Solutions tell me which appeal option I should choose?

A: No. We are a Legal Document Preparation service. We prepare documents based on the information you provide but do not provide legal advice or recommend legal strategies.

</div>`;}

function setupSignaturePad(canvas){

    if(!canvas) return;

    const ctx = canvas.getContext("2d");
    let drawing = false;
    let lastX = 0;
    let lastY = 0;

    ctx.lineWidth = 2.2;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#111";

    function pointFromEvent(e){
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        return {
            x:(e.clientX - rect.left) * scaleX,
            y:(e.clientY - rect.top) * scaleY
        };
    }

    canvas.addEventListener("pointerdown", function(e){
        e.preventDefault();
        drawing = true;
        const p = pointFromEvent(e);
        lastX = p.x;
        lastY = p.y;
        try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    });

    canvas.addEventListener("pointermove", function(e){
        if(!drawing) return;
        e.preventDefault();

        const p = pointFromEvent(e);

        ctx.beginPath();
        ctx.moveTo(lastX,lastY);
        ctx.lineTo(p.x,p.y);
        ctx.stroke();

        lastX = p.x;
        lastY = p.y;
    });

    function stopDrawing(e){
        drawing = false;
        if(e){
            try{ canvas.releasePointerCapture(e.pointerId); }catch(err){}
        }
    }

    canvas.addEventListener("pointerup", stopDrawing);
    canvas.addEventListener("pointercancel", stopDrawing);
    canvas.addEventListener("pointerleave", function(e){
        if(e.buttons === 0) stopDrawing(e);
    });
}

function clearSignature(id){

function load(){

    existingCases.clear();

    allData = snap.docs.map(function(d){

        r.caseNumber

      return r;

    });


    /*

    ==========================================
    */

      JSON.parse(
        localStorage.getItem(
          "lastUpload"
        ) || "[]"
      );


    /*
    ==========================================

    ==========================================
    */

    if(!activeFileCases.length){

      displayedCases = [];

      render([]);

      return;

    }


    /*
    ==========================================

    Let applyFilters() decide what should
    actually be displayed.
    ==========================================
    */

    applyFilters();

  });

}
  
function debounceFilter(){

  clearTimeout(
    debounceTimer
  );


  debounceTimer =
    setTimeout(function(){

      applyFilters();

    }, 150);

}
  
function applyFilters(){

  /*
  ==========================================
  GET CURRENT SEARCH VALUES
  ==========================================
  */

  const nameValue =
    (
      document.getElementById("searchName")?.value ||
      ""
    )
    .trim()
    .toLowerCase();


  const zipValue =
    (
      document.getElementById("searchZip")?.value ||
      ""
    )
    .trim()
    .toLowerCase();


  const dateValue =
    (
      document.getElementById("searchDate")?.value ||
      ""
    )
    .trim()
    .toLowerCase();


  const minValue =
    Number(
      document.getElementById("minAmt")?.value
    ) || 0;


  const maxInput =
    document.getElementById("maxAmt")?.value;


  const maxValue =
    maxInput === ""
      ? Infinity
      : Number(maxInput);


  /*
  ==========================================
  ONLY SEARCH INSIDE THE CURRENT FILE
  ==========================================
  */

  let rows =
    allData.filter(function(r){

      return activeFileCases.includes(
        r.caseNumber
      );

    });


  /*
  ==========================================
  NAME FILTER
  ==========================================
  */

  if(nameValue){

    rows =
      rows.filter(function(r){

        return String(
          r.name || ""
        )
        .toLowerCase()
        .includes(nameValue);

      });

  }


  /*
  ==========================================
  ZIP FILTER
  ==========================================
  */

  if(zipValue){

    rows =
      rows.filter(function(r){

        return String(
          r.zip || ""
        )
        .toLowerCase()
        .includes(zipValue);

      });

  }


  /*
  ==========================================
  DATE FILTER
  ==========================================
  */

  if(dateValue){

    rows =
      rows.filter(function(r){

        return String(
          r.hearing || ""
        )
        .toLowerCase()
        .includes(dateValue);

      });

  }


  /*
  ==========================================
  MINIMUM AMOUNT
  ==========================================
  */

  rows =
    rows.filter(function(r){

      return Number(r.amount || 0)
        >= minValue;

    });


  /*
  ==========================================
  MAXIMUM AMOUNT
  ==========================================
  */

  rows =
    rows.filter(function(r){

      return Number(r.amount || 0)
        <= maxValue;

    });


  /*
  ==========================================
  PRESERVE THE FILE'S ORIGINAL ORDER
  ==========================================
  */

  const orderedRows =
    activeFileCases
      .map(function(caseNumber){

        return rows.find(function(r){

          return r.caseNumber === caseNumber;

        });

      })
      .filter(Boolean);


  /*
  ==========================================
  DISPLAY FILTERED FILE
  ==========================================
  */

  displayedCases =
    orderedRows;


  render(
    orderedRows
  );

}

function uploadFile(){

  const fileInput =
    document.getElementById("file");

  if(!fileInput){

    alert("File upload control was not found.");

    return;

  }

  const file =
    fileInput.files[0];

  if(!file){

    alert("Choose a file first.");

    return;

  }


  /*
  ==========================================
  RESET CURRENT FILE VIEW
  ==========================================
  */

  activeFileCases = [];

  displayedCases = [];

  rowOrder = [];

  localStorage.removeItem("lastUpload");

  document.getElementById("tbody").innerHTML = "";


  /*
  ==========================================
  READ FILE
  ==========================================
  */

  const reader =
    new FileReader();


  reader.onerror = function(){

    alert(
      "Unable to read this file."
    );

  };


  reader.onload = function(event){

    try{

      const text =
        event.target.result;


      const lines =
        text
          .split(/\r?\n/)
          .filter(line =>
            line.trim() !== ""
          );


      if(lines.length < 2){

        alert(
          "The file appears to be empty or does not contain case records."
        );

        return;

      }


      /*
      ======================================
      HEADER ROW
      ======================================
      */

      const headers =
        lines[0]
          .split("\t")
          .map(function(h){

            return h
              .replace(/"/g,"")
              .trim();

          });


      let records = [];

      let newCases = 0;

      let updatedCases = 0;


      /*
      ======================================
      PROCESS FILE
      ======================================
      */

      for(let i = 1; i < lines.length; i++){

        const values =
          lines[i].split("\t");


        const row = {};


        headers.forEach(function(header,index){

          row[header] =
            values[index]
              ? values[index]
                  .replace(/"/g,"")
                  .trim()
              : "";

        });


        const caseNum =
          row["Case Number"];


        if(!caseNum){

          continue;

        }


        /*
        ====================================
        REMEMBER EVERY CASE IN THIS FILE
        ====================================
        */

        activeFileCases.push(
          caseNum
        );


        /*
        ====================================
        CASE INFORMATION
        ====================================
        */

        const amount =
          Number(
            row["Claim Amount"] || 0
          );


        const zip =
          row["Defendant Addr Zip"] || "";


        const addressParts = [

          row["Defendant Addr Line 1"] || "",

          row["Defendant Addr City"] || "",

          zip

        ].filter(Boolean);


        let lead = "Cold";

        let cls = "row-cold";


        if(amount > 1000){

          lead = "Hot";

          cls = "row-hot";

        }
        else if(amount > 500){

          lead = "Warm";

          cls = "row-warm";

        }


        /*
        ====================================
        PRESERVE EXISTING STATUS
        ====================================
        */

        const existing =
          allData.find(function(r){

            return r.caseNumber === caseNum;

          });


        const record = {

          caseNumber: caseNum,

          name:
            row["Defendant Name"] || "",

          address:
            addressParts.join(", "),

          amount: amount,

          hearing:
            row["Next Hearing Date"] || "",

          zip: zip,

          lead: lead,

          cls: cls,

          status:
            existing &&
            existing.status
              ? existing.status
              : "Open",

          updatedBy:
            currentUser

        };


        records.push(record);


        /*
        ====================================
        NEW VS UPDATED
        ====================================
        */

        if(
          existingCases.has(caseNum)
        ){

          updatedCases++;

        }
        else{

          newCases++;

        }


        /*
        ====================================
        UPDATE FIREBASE
        ====================================
        */

        db.collection("cases")
          .doc(caseNum)
          .set(
            record,
            { merge:true }
          )
          .then(function(){

            existingCases.add(
              caseNum
            );

          })
          .catch(function(error){

            console.error(
              "Firebase case save error:",
              caseNum,
              error
            );

          });


        /*
        ====================================
        UPDATE LOCAL DATA
        ====================================
        */

        const localIndex =
          allData.findIndex(function(r){

            return r.caseNumber === caseNum;

          });


        if(localIndex === -1){

          allData.push(record);

        }
        else{

          allData[localIndex] = {

            ...allData[localIndex],

            ...record

          };

        }

      }


      /*
      ==========================================
      REMOVE DUPLICATE CASE NUMBERS
      ==========================================
      */

      activeFileCases =
        [...new Set(activeFileCases)];


      /*
      ==========================================
      SAVE CURRENT FILE CASE LIST
      ==========================================
      */

      localStorage.setItem(

        "lastUpload",

        JSON.stringify(
          activeFileCases
        )

      );


      /*
      ==========================================
      DISPLAY THE FILE
      ==========================================
      */

      displayedCases =
        records;


      render(
        records
      );


      /*
      ==========================================
      DONE
      ==========================================
      */

      alert(
        "File Loaded Successfully\n\n" +
        "New Cases: " +
        newCases +
        "\n" +
        "Updated Cases: " +
        updatedCases
      );


    }
    catch(error){

      console.error(
        "UPLOAD ERROR:",
        error
      );


      alert(
        "Upload Error:\n\n" +
        error.message
      );

    }

  };


  reader.readAsText(file);

}
  
async function cycle(btn, id){

  const states = [
    "Open",
    "Contacted",
    "Processing",
    "Closed"
  ];


  /*
  ==========================================
  FIND THIS EXACT CASE
  ==========================================
  */

  const record =
    allData.find(function(r){

      return r.caseNumber === id;

    });


  if(!record){

    alert(
      "Case could not be found."
    );

    return;

  }


  /*
  ==========================================
  FIND NEXT STATUS
  ==========================================
  */

  const currentState =
    record.status || "Open";


  const currentIndex =
    states.indexOf(currentState);


  const nextIndex =
    currentIndex === -1
      ? 0
      : (currentIndex + 1) % states.length;


  const newState =
    states[nextIndex];


  /*
  ==========================================
  UPDATE LOCAL DATA IMMEDIATELY
  ==========================================
  */

  record.status =
    newState;

  record.updatedBy =
    currentUser;


  /*
  ==========================================
  SAVE TO FIREBASE
  ==========================================
  */

  try{

    await db
      .collection("cases")
      .doc(id)
      .update({

        status: newState,

        updatedBy: currentUser

      });


    /*
    ==========================================
    DO NOT MANUALLY REBUILD THE TABLE HERE.

    Firebase onSnapshot() will fire.

    load() will call applyFilters().

    applyFilters() will preserve:
      - current file
      - current search
      - current ZIP
      - current date
      - current amount filters
      - original file order
    ==========================================
    */


  }catch(error){

    console.error(
      "STATUS UPDATE ERROR:",
      error
    );


    /*
    Reload the current data if Firebase
    rejected the update.
    */

    alert(
      "Unable to update case status.\n\n" +
      error.message
    );

  }

}

        if(!el.id) return;

        if(el.type==="checkbox" || el.type==="radio"){
            data[el.id] = el.checked;

            data[el.id] = el.value;
        }

    });

    if(!data.caseNumber){
        return false;
    }

    data.savedBy = currentUser;
    data.savedOn = firebase.firestore.FieldValue.serverTimestamp();

    await db.collection("intakes").doc(data.caseNumber).set(data);

    return true;

}catch(err){

    console.error(err);
    return false;

}

async function loadIntake(formDoc, intakeID){

        const data = intakeDoc.data();

        Object.keys(data).forEach(key => {

            const el =
                formDoc.getElementById(key);

            if(!el){
                return;
            }

            if(
                el.type === "checkbox" ||
                el.type === "radio"
            ){

                el.checked = !!data[key];

            }else{

                el.value = data[key] ?? "";

            }

        });

        currentIntakeID = intakeID;

        return true;

//======================================

//======================================

async function openSavedIntake(intakeID){

    if(!currentIntakeWindow){
        alert(
            "The Intake window is no longer available."
        );
        return;
    }

    if(!intakeID){
        currentIntakeWindow.defaultView.alert(
            "Unable to open this intake because the saved intake ID is missing."
        );
        return;
    }

    try{

        const ok =
            await loadIntake(
                currentIntakeWindow,
                intakeID
            );

        if(!ok){
            currentIntakeWindow.defaultView.alert(
                "Unable to load this saved intake."
            );
            return;
        }

        currentIntakeID = intakeID;

        /*
        ==========================================
        CLOSE SAVED INTAKES POPUP
        INSIDE THE INTAKE WINDOW
        ==========================================
        */

        const modal =
            currentIntakeWindow.getElementById(
                "savedIntakesModal"
            );

        if(modal){
            modal.style.display = "none";
        }

        /*
        ==========================================
        RESTORE INTAKE WINDOW SCROLLING
        ==========================================
        */

        currentIntakeWindow.body.style.overflow = "";

        /*
        ==========================================
        KEEP INTAKE WINDOW ACTIVE
        ==========================================
        */

        currentIntakeWindow.defaultView.focus();

        /*
        ==========================================
        IMPORTANT:
        SHOW SUCCESS MESSAGE INSIDE
        THE INTAKE WINDOW
        ==========================================
        */

        currentIntakeWindow.defaultView.alert(
            "✅ Intake Loaded Successfully"
        );

        return true;

    }catch(error){

        console.error(
            "OPEN SAVED INTAKE ERROR:",
            error
        );

        currentIntakeWindow.defaultView.alert(
            "Unable to open this saved intake.\n\n" +
            error.message
        );

        return false;
    }
}
  
//======================================
// DELETE SAVED INTAKE
//======================================

async function deleteSavedIntake(intakeID){

    if(!intakeID){

        currentIntakeWindow?.defaultView.alert(
            "Unable to delete this intake because the saved intake ID is missing."
        );

        return;
    }

    const client =
        savedIntakes.find(
            c =>
                String(c.id) ===
                String(intakeID)
        );

    const clientName =
        client
            ? (
                client.clientName ||
                client.caseNumber ||
                intakeID
            )
            : intakeID;

    const confirmed =
        currentIntakeWindow
            ? currentIntakeWindow.defaultView.confirm(
                "DELETE SAVED INTAKE?\n\n" +
                "Client: " +
                clientName +
                "\n\n" +
                "This will permanently delete this saved intake.\n\n" +
                "Click OK to permanently delete it."
            )
            : confirm(
                "DELETE SAVED INTAKE?\n\n" +
                "Client: " +
                clientName +
                "\n\n" +
                "This will permanently delete this saved intake.\n\n" +
                "Click OK to permanently delete it."
            );

    if(!confirmed){
        return;
    }

    try{

        await db
            .collection("intakes")
            .doc(String(intakeID))
            .delete();

        savedIntakes =
            savedIntakes.filter(
                c =>
                    String(c.id) !==
                    String(intakeID)
            );

        if(
            String(currentIntakeID) ===
            String(intakeID)
        ){
            currentIntakeID = "";
        }

        /*
        ==========================================
        REFRESH THE SAVED INTAKE LIST
        INSIDE THE INTAKE WINDOW
        ==========================================
        */

        if(currentIntakeWindow){

            renderSavedIntakesForIntakeWindow(
                currentIntakeWindow,
                savedIntakes
            );

            currentIntakeWindow.defaultView.alert(
                "✅ Saved intake deleted successfully."
            );

        }else{

            alert(
                "✅ Saved intake deleted successfully."
            );

        }

    }catch(error){

        console.error(
            "DELETE INTAKE ERROR:",
            error
        );

        if(currentIntakeWindow){

            currentIntakeWindow.defaultView.alert(
                "Unable to delete this saved intake.\n\n" +
                error.message
            );

        }else{

            alert(
                "Unable to delete this saved intake.\n\n" +
                error.message
            );

        }
    }
}

// CLOSE SAVED INTAKES
//======================================

function closeSavedIntakes(){

    // Prefer the active Intake window.
    const targetDoc =
        currentIntakeWindow || document;

    const modal =
        targetDoc.getElementById(
            "savedIntakesModal"
        );

    if(modal){

        modal.style.display = "none";

    }

    // Restore scrolling to whichever window
    // contains the Saved Intake popup.
    if(targetDoc.body){

        targetDoc.body.style.overflow = "";

    }

}

//======================================
// SAFE HTML
//======================================

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}
